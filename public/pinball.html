<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<title>Pinball</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
body { display: flex; align-items: center; justify-content: center; }
canvas { display: block; }

#sound-btn {
  position: absolute; top: 14px; left: 14px; z-index: 20;
  padding: 10px 16px; border-radius: 999px; border: 2px solid var(--accent, #ffb732);
  background: rgba(0, 0, 0, 0.75); color: var(--accent, #ffcc55); font-size: 15px; font-weight: bold;
  cursor: pointer; box-shadow: 0 0 18px rgba(255, 255, 255, 0.15);
}

#launch-btn {
  position: absolute; bottom: 20px; right: 15px; z-index: 20;
  width: 84px; height: 84px; border-radius: 50%; font-size: 15px;
  background: radial-gradient(circle, #e94560, #c23152);
  color: #fff; border: 3px solid #ff6b81; cursor: pointer;
  box-shadow: 0 0 20px rgba(233,69,96,0.6); font-weight: bold;
  touch-action: none; user-select: none;
}

/* Tastaturspill: tastene, plassen i køen eller "spill igjen" – smalt, nede til venstre for poengdisplayet */
#kb-hint {
  position: absolute; bottom: 20px; left: 14px; z-index: 20; display: none;
  max-width: 190px; padding: 8px 14px; border-radius: 14px;
  background: rgba(0, 0, 0, 0.75); color: #fff; font-size: 14px; line-height: 1.7;
  border: 1px solid rgba(255, 255, 255, 0.25);
}
#kb-hint kbd {
  display: inline-block; min-width: 1.7em; padding: 0 6px; border-radius: 5px; text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.4); border-bottom-width: 3px; font: inherit; font-weight: bold;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="sound-btn">🔊 Klikk for lyd</button>
<button id="launch-btn">🚀 Hold<br>og slipp</button>
<div id="kb-hint"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/engine/sound.js"></script>
<script src="/engine/renderer.js"></script>
<script src="/engine/screens.js"></script>
<script>
// Selve maskinen: tegner brettet med temaet til maskinen som er i bruk.
// Alt utseende ligger i public/machines/<id>/theme.js, all tegning i engine/renderer.js.
const canvas = document.getElementById('game');
const socket = io();
socket.on('connect', () => socket.emit('table-screen'));
PinballRenderer.init(canvas);
PinballScreens.announce('brett');
PinballScreens.addFullscreenButton();

/* ══════════════════════ LYD ══════════════════════ */
const soundBtn = document.getElementById('sound-btn');
PinballSound.onChange(on => { soundBtn.style.display = on ? 'none' : 'block'; });
soundBtn.addEventListener('click', PinballSound.init);
window.addEventListener('pointerdown', PinballSound.init);
window.addEventListener('keydown', PinballSound.init);
const playSound = (type, e) => PinballSound.play(PinballRenderer.theme.sounds, type, e);

/* ══════════════════════ TEMA ══════════════════════ */
// ?tema=<id> i adressen låser temaet (for å forhåndsvise en maskin)
const forcedTheme = new URLSearchParams(location.search).get('tema');
const themeLoads = {};
let currentThemeId = null;

function loadTheme(id) {
  if (!themeLoads[id]) {
    themeLoads[id] = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = `/machines/${encodeURIComponent(id)}/theme.js`;
      s.onload = () => PinballThemes[id] ? resolve(PinballThemes[id]) : reject(new Error('Tema mangler: ' + id));
      s.onerror = () => reject(new Error('Fant ikke tema: ' + id));
      document.head.appendChild(s);
    });
  }
  return themeLoads[id];
}

// Egne maskiner låner utseendet til en innebygd maskin, men har egen tittel og evt. egen spillefelt-farge
function useTheme(id, title, playfieldColor) {
  const key = [id, title || '', playfieldColor || ''].join('|');
  if (!id || key === currentThemeId) return;
  currentThemeId = key;
  loadTheme(id)
    .then(theme => { if (currentThemeId === key) PinballRenderer.setTheme(PinballRenderer.customize(theme, { title, playfieldColor })); })
    .catch(err => console.error(err.message));
}

/* ══════════════════════ TILSTAND ══════════════════════ */
let state = {
  players: [], scores: {}, currentPlayer: null, ballsLeft: 0, ballsPerGame: 3, gameOver: null,
  launchCountdown: null, machine: null,
  ball: { x: 670, y: 1180, r: 9, ready: true },
  flippers: { left: { angle: 0.5, pressed: false }, right: { angle: Math.PI - 0.5, pressed: false } },
  bumpers: [], slingFlash: [0, 0], plunger: 0, events: [],
};

socket.on('layout', (data) => PinballRenderer.setLayout(data));

socket.on('state', (data) => {
  if (forcedTheme) useTheme(forcedTheme);
  else useTheme(data.theme || data.machine || 'gard', data.title, data.playfieldColor);
  for (const e of data.events || []) playSound(e.type, e);
  PinballRenderer.handleEvents(data);
  for (const side of ['left', 'right']) {
    const was = state.flippers[side].pressed, now = data.flippers[side].pressed;
    if (now && !was) playSound('flipper');
    if (!now && was) playSound('flipperDown');
  }
  state = data;
  // Storskjermen kan skyte ut ballen i fritt spill (når ingen står i kø), eller når tastaturspilleren har tur
  launchBtn.style.display = state.ball.ready && (!state.currentPlayer || state.currentPlayer === myId) ? 'block' : 'none';
  updateKbHint();
});

function drawGame(now) {
  PinballRenderer.frame(state, now);
  requestAnimationFrame(drawGame);
}

/* ══════════════════════ KONTROLLER ══════════════════════ */
// Oppskyting: hold inne for å trekke fjæra, slipp for å skyte
const launchBtn = document.getElementById('launch-btn');
let pulling = false;
function startPull() { if (!pulling) { pulling = true; socket.emit('plunger-pull'); } }
function release() { if (pulling) { pulling = false; socket.emit('ball-launch'); } }
launchBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); PinballSound.init(); startPull(); });
launchBtn.addEventListener('pointerup', release);
launchBtn.addEventListener('pointerleave', release);

// Tastatur: piltaster/Z/M (eller A/D) for flipperne, hold mellomrom for å skyte ut ballen
const keyMap = { ArrowLeft: 'flip-left', z: 'flip-left', a: 'flip-left', ArrowRight: 'flip-right', m: 'flip-right', d: 'flip-right' };
const keyOf = (e) => e.key.length === 1 ? e.key.toLowerCase() : e.key;
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const key = keyOf(e);
  if (keyMap[key]) socket.emit(keyMap[key], true);
  if (key === ' ' || key === 'Enter') { e.preventDefault(); startPull(); }
  if (key === 'n' && kbJoin && queuePos() < 0) joinKeyboard(kbJoin.machine, kbJoin.name);
});
document.addEventListener('keyup', (e) => {
  const key = keyOf(e);
  if (keyMap[key]) socket.emit(keyMap[key], false);
  if (key === ' ' || key === 'Enter') release();
});

/* ══════════════════════ SPILL MED TASTATUR ══════════════════════ */
// Hovedsiden kan gjøre dette vinduet til en spiller: ?spill=<maskin>&navn=<navn> i adressen, eller en
// beskjed over BroadcastChannel hvis vinduet allerede er åpent. Vinduet stiller seg da i kø med sin
// egen faste klient-id (som mobilen), og tastaturet styrer når det blir dens tur.
const KB_ID_KEY = 'pinball-tastatur-id';
let kbId = null;
try { kbId = localStorage.getItem(KB_ID_KEY); } catch (e) { /* ingen lagring – ny id ved påmelding */ }
// Siste påmelding fra dette vinduet { machine, name, at } – huskes i fanen, så omlasting beholder hint og "spill igjen"
const KB_JOIN_KEY = 'pinball-tastatur-paamelding';
let kbJoin = null;
try { kbJoin = JSON.parse(sessionStorage.getItem(KB_JOIN_KEY)); } catch (e) { /* ingen påmelding */ }
let pendingJoin = false; // påmelding som venter på tilkobling
let myId = null;         // offentlig id når vinduet er spiller

function makeId() {
  return Array.from({ length: 24 }, () => 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)]).join('');
}

// Ved (gjen)tilkobling: si hvem vi er, så plassen i køen beholdes, og send en ventende påmelding
socket.on('connect', () => {
  if (kbId) socket.emit('hello', { clientId: kbId });
  if (pendingJoin) { pendingJoin = false; socket.emit('join-queue', { machine: kbJoin.machine, name: kbJoin.name }); }
});
socket.on('you', (data) => { myId = data.id; });

function joinKeyboard(machine, name) {
  if (typeof machine !== 'string' || typeof name !== 'string' || !name.trim()) return;
  if (!kbId) {
    kbId = makeId();
    try { localStorage.setItem(KB_ID_KEY, kbId); } catch (e) { /* gjelder bare dette vinduet */ }
  }
  kbJoin = { machine, name: name.trim(), at: Date.now() };
  try { sessionStorage.setItem(KB_JOIN_KEY, JSON.stringify(kbJoin)); } catch (e) { /* huskes ikke */ }
  PinballSound.init();
  if (socket.connected) {
    socket.emit('hello', { clientId: kbId });
    socket.emit('join-queue', { machine, name: kbJoin.name });
  } else {
    pendingJoin = true;
  }
  updateKbHint();
}

// Plassen i køen (0 = spiller nå), eller -1
const queuePos = () => myId ? state.players.findIndex(p => p.id === myId) : -1;

const kbHint = document.getElementById('kb-hint');
let lastHint = '';
function updateKbHint() {
  let html = '';
  if (kbJoin) {
    const pos = queuePos();
    if (pos === 0) {
      html = '<kbd>←</kbd> <kbd>Z</kbd> venstre<br><kbd>→</kbd> <kbd>M</kbd> høyre<br><kbd>mellomrom</kbd> skyt';
    } else if (pos > 0) {
      html = `⏳ Du er nr. ${pos} i køen – vent på tur`;
    } else if (Date.now() - kbJoin.at < 2000) {
      html = 'Melder deg på…';
    } else {
      html = '🔁 Trykk <kbd>N</kbd> for å spille igjen';
    }
  }
  if (html === lastHint) return;
  lastHint = html;
  kbHint.innerHTML = html;
  kbHint.style.display = html ? 'block' : 'none';
}

const params = new URLSearchParams(location.search);
if (params.has('spill')) {
  joinKeyboard(params.get('spill'), params.get('navn') || '');
  // Fjern påmeldingen fra adressen, så en omlasting ikke melder på på nytt
  params.delete('spill');
  params.delete('navn');
  history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : ''));
}
PinballScreens.onMessage('brett', (p) => joinKeyboard(p.spill, p.navn));

PinballRenderer.resize();
window.addEventListener('resize', () => PinballRenderer.resize());
requestAnimationFrame(drawGame);
</script>
</body>
</html>
