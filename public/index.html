<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinball – velg maskin</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #1b1240 0%, #07060f 70%);
  color: #fff;
  font-family: 'Segoe UI', sans-serif;
  padding: 28px 24px 40px;
}

header { text-align: center; margin-bottom: 26px; }

h1 {
  font-size: clamp(2.2em, 6vw, 4em);
  letter-spacing: 8px;
  text-transform: uppercase;
  background: linear-gradient(90deg, #ff6b6b, #ffe66d, #4ecdc4, #b26bff, #ff6b6b);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 6s ease-in-out infinite;
}

@keyframes shimmer {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.subtitle { color: #aab; letter-spacing: 3px; text-transform: uppercase; font-size: 0.95em; margin-top: 4px; }

/* "Spiller nå" øverst */
.now-playing {
  max-width: 900px;
  margin: 0 auto 26px;
  padding: 14px 22px;
  border-radius: 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-size: 1.25em;
  text-align: center;
}
.now-playing b { color: var(--accent, #ffe66d); }
.now-playing .score { font-family: 'Courier New', monospace; font-weight: bold; color: var(--accent, #ffe66d); }

/* Maskinkortene */
.machines {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 380px));
  justify-content: center;
  gap: 26px;
  margin-bottom: 30px;
}

.machine {
  position: relative;
  border-radius: 22px;
  padding: 22px 22px 20px;
  background: linear-gradient(160deg, var(--bg), var(--bg2));
  border: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  text-decoration: none;
  transition: transform 0.2s, box-shadow 0.2s;
}

.machine.on-table {
  border-color: var(--accent);
  box-shadow: 0 0 34px color-mix(in srgb, var(--accent) 45%, transparent), 0 10px 40px rgba(0,0,0,0.5);
}

.badge {
  position: absolute;
  top: -12px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--accent);
  color: #000;
  font-size: 0.75em;
  font-weight: bold;
  letter-spacing: 1px;
  display: none;
}
.machine.on-table .badge { display: block; }

.machine .icon { font-size: 3.2em; line-height: 1.1; }
.machine h2 { font-size: 1.7em; letter-spacing: 1px; color: var(--accent); margin: 6px 0 4px; }
.machine .tagline { opacity: 0.8; font-size: 0.95em; min-height: 2.4em; }

.qr {
  background: #fff;
  padding: 10px;
  border-radius: 14px;
  margin: 16px 0 10px;
}
.scan { font-size: 0.9em; opacity: 0.85; }

.play-btn {
  display: none;
  margin: 16px 0 6px;
  padding: 14px 34px;
  border-radius: 999px;
  background: var(--accent);
  color: #000;
  font-weight: bold;
  font-size: 1.15em;
  letter-spacing: 1px;
}

.record {
  margin-top: 12px;
  font-size: 0.9em;
  opacity: 0.85;
}
.record b { font-family: 'Courier New', monospace; color: var(--accent); }

/* Køen */
.queue {
  max-width: 600px;
  margin: 0 auto;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 18px 26px;
}
.queue h3 { text-align: center; color: #ffe66d; letter-spacing: 3px; margin-bottom: 10px; font-size: 1em; }
.queue-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.queue-row:last-child { border-bottom: none; }
.queue-row .who { font-size: 1.05em; }
.queue-row .what { opacity: 0.75; }
.empty { text-align: center; color: #667; font-style: italic; padding: 6px; }

/* Skjermene: knapper som åpner brettet og poengtavla i egne vinduer (bare på PC) */
.screens {
  max-width: 900px;
  margin: 0 auto 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.screens-label { color: #aab; font-size: 0.95em; margin-right: 4px; }
.screens button {
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.06);
  color: #fff;
  font-size: 0.95em;
  font-weight: bold;
  cursor: pointer;
}
.screens button:hover { background: rgba(255,255,255,0.14); }
.screens button.is-open { border-color: #4ade80; color: #4ade80; }
.screens button.primary { background: #ffe66d; color: #000; border-color: #ffe66d; }
.screens-msg { flex-basis: 100%; text-align: center; color: #ffb3b3; font-size: 0.9em; min-height: 1.2em; }

/* Smale vinduer: én kolonne */
@media (max-width: 760px) {
  body { padding: 18px 14px 30px; }
  .machines { grid-template-columns: 1fr; gap: 20px; }
}

/* Mobil (berøringsskjerm): trykk på et kort i stedet for å skanne, og ingen skjermknapper */
@media (pointer: coarse) {
  .qr, .scan, .screens { display: none; }
  .play-btn { display: inline-block; }
  .subtitle .big-screen { display: none; }
  .subtitle .small-screen { display: inline; }
}
.subtitle .small-screen { display: none; }
</style>
</head>
<body>

<header>
  <h1>🎰 Pinball 🎰</h1>
  <div class="subtitle">
    <span class="big-screen">Velg maskin – skann QR-koden for å stille deg i kø</span>
    <span class="small-screen">Trykk på maskinen du vil spille</span>
  </div>
</header>

<div class="screens" id="screens">
  <span class="screens-label">🖥️ Skjermer:</span>
  <button id="open-brett">🎰 Åpne brettet</button>
  <button id="open-score">🏆 Åpne poengtavla</button>
  <button id="open-both" class="primary">Åpne begge</button>
  <div class="screens-msg" id="screens-msg"></div>
</div>

<div class="now-playing" id="now-playing">Kobler til…</div>

<div class="machines" id="machines"></div>

<div class="queue">
  <h3>⏳ KØEN</h3>
  <div id="queue"><div class="empty">Ingen i kø</div></div>
</div>

<script src="/engine/screens.js"></script>
<script>
const socket = io();
let machines = [];

/* ── skjermene (brett og poengtavle) ── */
const screenBtns = { brett: document.getElementById('open-brett'), score: document.getElementById('open-score') };
const screenText = {
  brett: ['🎰 Åpne brettet', '✅ Brettet er åpent'],
  score: ['🏆 Åpne poengtavla', '✅ Poengtavla er åpen'],
};
const bothBtn = document.getElementById('open-both');
const screensMsg = document.getElementById('screens-msg');

function openScreen(screen) {
  const ok = PinballScreens.open(screen);
  if (!ok) screensMsg.textContent = 'Nettleseren blokkerte vinduet. Tillat sprettoppvinduer for denne siden, eller trykk på knappen igjen.';
  return ok;
}
screenBtns.brett.addEventListener('click', () => openScreen('brett'));
screenBtns.score.addEventListener('click', () => openScreen('score'));
// Mange nettlesere slipper bare gjennom ett nytt vindu per klikk. Blir det andre blokkert,
// står knappen for det igjen, så det holder med ett klikk til.
bothBtn.addEventListener('click', () => {
  screensMsg.textContent = '';
  if (openScreen('brett') && !PinballScreens.open('score')) {
    screensMsg.textContent = 'Brettet er åpnet. Trykk «Åpne poengtavla» for å åpne poengtavla også.';
  }
});

PinballScreens.watch((open) => {
  for (const s of ['brett', 'score']) {
    screenBtns[s].textContent = screenText[s][open[s] ? 1 : 0];
    screenBtns[s].classList.toggle('is-open', open[s]);
    screenBtns[s].title = open[s] ? 'Hent fram vinduet' : 'Åpne i eget vindu – dra det over til riktig skjerm';
  }
  bothBtn.style.display = open.brett || open.score ? 'none' : '';
  if (open.brett && open.score) screensMsg.textContent = '';
});

let lastQueue = null, lastNow = null;

// Spillernavn kommer fra brukerne og må aldri settes rett inn som HTML
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const machineById = (id) => machines.find(m => m.id === id);
const controllerUrl = (id) => `${location.origin}/mobile.html?maskin=${encodeURIComponent(id)}`;

// Maskinlista kommer ved tilkobling og hver gang en toppliste endres
socket.on('machines', (list) => {
  const first = machines.length === 0;
  machines = list;
  if (first) renderMachines(); else updateRecords();
});

function renderMachines() {
  const box = document.getElementById('machines');
  box.innerHTML = '';
  for (const m of machines) {
    const card = document.createElement('a');
    card.className = 'machine';
    card.id = 'machine-' + m.id;
    card.href = controllerUrl(m.id);
    const c = m.colors || {};
    card.style.setProperty('--bg', c.bg || '#1a1a2e');
    card.style.setProperty('--bg2', c.bg2 || '#16213e');
    card.style.setProperty('--accent', c.accent || '#ffe66d');
    card.style.setProperty('--text', c.text || '#fff');
    card.innerHTML = `
      <div class="badge">PÅ BRETTET NÅ</div>
      <div class="icon">${escapeHtml(m.icon)}</div>
      <h2>${escapeHtml(m.name)}</h2>
      <div class="tagline">${escapeHtml(m.tagline)}</div>
      <div class="qr"></div>
      <div class="scan">📱 Skann for å spille</div>
      <div class="play-btn">▶ SPILL DENNE</div>
      <div class="record"></div>`;
    box.appendChild(card);
    new QRCode(card.querySelector('.qr'), { text: controllerUrl(m.id), width: 150, height: 150 });
  }
  updateRecords();
}

function updateRecords() {
  for (const m of machines) {
    const el = document.querySelector(`#machine-${m.id} .record`);
    if (!el) continue;
    const top = m.highScores[0];
    el.innerHTML = top ? `🏆 Rekord: <b>${top.score.toLocaleString('nb-NO')}</b> – ${escapeHtml(top.name)}` : '🏆 Ingen rekord ennå – bli den første!';
  }
}

socket.on('state', (state) => {
  // Maskinen på brettet
  for (const m of machines) {
    const card = document.getElementById('machine-' + m.id);
    if (card) card.classList.toggle('on-table', m.id === state.machine);
  }

  // Hvem spiller nå
  const current = state.players.find(p => p.id === state.currentPlayer);
  const m = machineById(state.machine);
  const nowBox = document.getElementById('now-playing');
  if (m) nowBox.style.setProperty('--accent', (m.colors && m.colors.accent) || '#ffe66d');
  const nowHtml = current && m
    ? `${escapeHtml(m.icon)} <span><b>${escapeHtml(current.name)}</b> spiller ${escapeHtml(m.name)} – ball ${state.ballsPerGame - state.ballsLeft + 1}/${state.ballsPerGame}</span>
       <span class="score">${(state.scores[current.id] || 0).toLocaleString('nb-NO')}</span>`
    : '✅ Ledig! Velg en maskin og begynn å spille.';
  if (nowHtml !== lastNow) { nowBox.innerHTML = nowHtml; lastNow = nowHtml; }

  // Køen (uten den som spiller)
  const waiting = state.players.filter(p => p.id !== state.currentPlayer);
  const queueHtml = waiting.length
    ? waiting.map((p, i) => {
        const pm = machineById(p.machine);
        return `<div class="queue-row"><span class="who">${i + 1}. ${escapeHtml(p.name)}${p.away ? ' <small>(frakoblet)</small>' : ''}</span>
                <span class="what">${pm ? escapeHtml(pm.icon + ' ' + pm.name) : ''}</span></div>`;
      }).join('')
    : '<div class="empty">Ingen i kø</div>';
  if (queueHtml !== lastQueue) { document.getElementById('queue').innerHTML = queueHtml; lastQueue = queueHtml; }
});
</script>
</body>
</html>
