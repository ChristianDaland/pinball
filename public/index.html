<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<title>⚡ Pinball Spill</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; font-family: 'Segoe UI', sans-serif; }
#ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10; }
#scorebar { display: flex; justify-content: center; gap: 40px; padding: 12px; }
.player-score { background: rgba(0,0,0,0.6); border: 1px solid rgba(233,69,96,0.4); border-radius: 8px; padding: 8px 20px; color: #fff; text-align: center; }
.player-score .name { font-size: 13px; color: #888; }
.player-score .pts { font-size: 28px; font-weight: bold; color: #4ade80; text-shadow: 0 0 10px rgba(74,222,128,0.5); }
#name-form { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(10,10,26,0.97); border: 2px solid #e94560; border-radius: 16px; padding: 32px; text-align: center; pointer-events: auto; z-index: 100; box-shadow: 0 0 60px rgba(233,69,96,0.3); }
#name-form input { font-size: 20px; padding: 10px 16px; border: 2px solid #e94560; background: transparent; color: #fff; text-align: center; outline: none; border-radius: 8px; width: 260px; }
#name-form button { margin-top: 16px; font-size: 18px; padding: 10px 32px; background: #e94560; color: #fff; border: none; border-radius: 8px; cursor: pointer; pointer-events: auto; }
#name-form button:hover { background: #c23152; }
#message-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 50; pointer-events: none; display: none; }
#ball-launch { position: absolute; bottom: 20px; right: 15px; z-index: 20; display: none; }
#ball-launch button { width: 80px; height: 80px; border-radius: 50%; font-size: 24px; background: radial-gradient(circle, #e94560, #c23152); color: #fff; border: 3px solid #ff6b81; cursor: pointer; box-shadow: 0 0 20px rgba(233,69,96,0.6); }
#ball-launch button:active { transform: scale(0.9); background: radial-gradient(circle, #ff6b81, #e94560); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="scorebar"><div class="player-score" style="display:none"><div class="name"></div><div class="pts"></div></div></div>
</div>

<div id="name-form">
  <h2 style="color:#e94560;margin-bottom:16px;">⚡ Pinball</h2>
  <input id="name-input" placeholder="Skriv navnet ditt" autofocus />
  <br/><button id="join-btn">Bli med</button>
</div>

<div id="ball-launch"><button id="launch-btn">🎱</button></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const ratio = 10 / 16; // cabinet width/height ratio
  const winRatio = window.innerWidth / window.innerHeight;
  
  if (winRatio > ratio) {
    canvas.height = Math.min(window.innerHeight, 800);
    canvas.width = canvas.height * ratio;
  } else {
    canvas.width = window.innerWidth;
    canvas.height = canvas.width / ratio;
  }
  W = canvas.width;
  H = canvas.height;
}
resize();
window.addEventListener('resize', resize);

const socket = io();

// --- Game State ---
let players = {};
let scores = {};
let ball = { x: 50, y: 40, vx: 2, vy: 3, radius: 6, r: 6, active: false };
let bumpers = [];
let slingshots = [];
let walls = [];
let flippers = { left: false, right: false };
let particles = [];
let messageText = '';
let messageTimer = 0;
let currentLevel = 1;
let scoreBroadcastTimer = 0;

// --- Audio ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type='square', vol=0.15) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + dur);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

const SOUNDS = {
  bumper: () => { playSound(880, 0.15, 'square', 0.2); setTimeout(() => playSound(660, 0.1, 'square', 0.15), 50); },
  wall: () => playSound(220, 0.08, 'triangle', 0.1),
  flipper: () => playSound(330, 0.05, 'sawtooth', 0.1),
  score: () => { playSound(523, 0.1, 'sine', 0.15); setTimeout(() => playSound(659, 0.1, 'sine', 0.15), 80); setTimeout(() => playSound(784, 0.15, 'sine', 0.2), 160); },
  drain: () => { playSound(220, 0.3, 'sawtooth', 0.1); setTimeout(() => playSound(165, 0.4, 'sawtooth', 0.08), 150); }
};

// --- Cabinet geometry (relative to game canvas size) ---
function getCabinet() {
  const cw = W; // canvas.width is the game coordinate width
  const ch = H; // canvas.height is the game coordinate height
  return {
    left:   cw * 0.05,       // inner wall x
    right:  cw * 0.95,      // inner wall x
    top:    ch * 0.03,       // top wall y
    bottom: ch * 0.97,       // drain start
    plungerLane: { left: cw*0.88, right: cw*0.96 },
    flipperLeftPivot:  { x: cw*0.25, y: ch*0.82 },
    flipperRightPivot: { x: cw*0.70, y: ch*0.82 },
    flipperLength:     cw * 0.14,
    leftBumperZones:   [], // set from bumpers data
    rightBumperZones:  [],
  };
}

// --- Socket events ---
socket.on('state', (data) => {
  if (data.players) players = {};
  Object.entries(data.players || {}).forEach(([i, p]) => {
    // data.players is an array with id field
  });
  if (data.players && Array.isArray(data.players)) {
    data.players.forEach(p => { players[p.id] = { name: p.name }; scores[p.id] = scores[p.id] || 0; });
  } else {
    // legacy object format
    players = data.players || {};
  }
  if (data.scores) scores = data.scores;
  if (data.ball) {
    ball = data.ball;
    if (ball.r === undefined && ball.radius !== undefined) ball.r = ball.radius;
  }
  bumpers = data.bumpers || [];
  slingshots = data.slingshots || [];
  walls = data.walls || [];
  flippers = data.flippers || { left: false, right: false };
  if (data.message) { messageText = data.message; messageTimer = 180; }
  if (data.level !== undefined) currentLevel = data.level;
  updateUI();
});

socket.on('particle', (p) => particles.push(p));

socket.on('ball-ready', () => {
  document.getElementById('ball-launch').style.display = 'block';
});

// --- UI Update ---
function updateUI() {
  const bar = document.getElementById('scorebar');
  const keys = Object.keys(scores);
  if (keys.length === 0) return;
  
  let html = '';
  // Show all players with their scores
  const allPlayerNames = new Set();
  Object.entries(players).forEach(([id, p]) => {
    allPlayerNames.add(p.name);
  });
  
  keys.forEach(id => {
    const name = players[id]?.name || 'Ukjent';
    html += `<div class="player-score"><div class="name">${name}</div><div class="pts">${scores[id]}</div></div>`;
  });
  bar.innerHTML = html;
}

// --- Drawing helpers ---
function drawNeonText(text, x, y, size, color = '#e94560') {
  ctx.save();
  ctx.font = `bold ${size}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color;
  ctx.shadowBlur = 18;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 6;
  ctx.fillStyle = '#fff';
  ctx.fillText(text, x, y);
  ctx.restore();
}

// --- Main render ---
function drawGame() {
  // Background gradient (cabinet feel)
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0e0e24');
  grad.addColorStop(0.5, '#141438');
  grad.addColorStop(1, '#0a0a1c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle grid
  ctx.strokeStyle = 'rgba(233,69,96,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 50) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  const cab = getCabinet();

  // === Draw walls (cabinet shape) ===
  ctx.save();
  ctx.strokeStyle = '#2a2a4a';
  ctx.lineWidth = 6;
  ctx.shadowColor = '#e94560';
  ctx.shadowBlur = 10;
  
  // Left wall
  ctx.fillStyle = 'rgba(42,42,74,0.6)';
  ctx.fillRect(0, 0, cab.left, H);
  ctx.strokeRect(0, 0, cab.left, H);
  
  // Right wall (plunger lane left side)
  ctx.fillStyle = 'rgba(42,42,74,0.6)';
  ctx.fillRect(cab.plungerLane.left, 0, W - cab.plungerLane.left, H);
  ctx.strokeRect(cab.plungerLane.left, 0, W - cab.plungerLane.left, H);
  
  // Top wall
  ctx.fillStyle = 'rgba(42,42,74,0.6)';
  ctx.fillRect(cab.left, 0, cab.right - cab.left, cab.top + cab.left);
  ctx.strokeRect(cab.left, 0, cab.right - cab.left, cab.top + cab.left);
  
  // Bottom (drain area between flippers)
  const drainWidth = cab.flipperRightPivot.x - cab.flipperLeftPivot.x - cab.flipperLength * 1.2;
  const drainCenterX = (cab.flipperLeftPivot.x + cab.flipperRightPivot.x) / 2;
  
  // Left bottom wall
  ctx.fillStyle = 'rgba(42,42,74,0.6)';
  ctx.fillRect(cab.left, cab.bottom - cab.top, drainCenterX - drainWidth/2 - cab.left, cab.top);
  ctx.strokeRect(cab.left, cab.bottom - cab.top, drainCenterX - drainWidth/2 - cab.left, cab.top);
  
  // Right bottom wall
  ctx.fillRect(drainCenterX + drainWidth/2, cab.bottom - cab.top, W - (drainCenterX + drainWidth/2), cab.top);
  ctx.strokeRect(drainCenterX + drainWidth/2, cab.bottom - cab.top, W - (drainCenterX + drainWidth/2), cab.top);
  
  // Bottom edge below flippers
  const midFlipY = cab.flipperLeftPivot.y;
  ctx.fillStyle = 'rgba(42,42,74,0.3)';
  ctx.fillRect(cab.left, midFlipY, drainWidth, H - midFlipY);
  ctx.strokeRect(cab.left, midFlipY, drainWidth, H - midFlipY);
  
  // Plunger lane right wall
  ctx.fillStyle = 'rgba(42,42,74,0.6)';
  ctx.fillRect(cab.plungerLane.right, 0, W - cab.plungerLane.right, H);
  ctx.strokeRect(cab.plungerLane.right, 0, W - cab.plungerLane.right, H);
  
  ctx.restore();

  // === Draw bumpers ===
  bumpers.forEach(b => {
    const bx = b.x / 800 * W;
    const by = b.y / 1300 * H;
    const br = b.r / 800 * W;
    
    ctx.save();
    // Flash effect on recent hit
    if (b.hitFlash > 0) {
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = b.hitFlash * 20;
      b.hitFlash -= 1;
    } else {
      ctx.shadowColor = b.color || '#e94560';
      ctx.shadowBlur = 20;
    }
    
    const bg = ctx.createRadialGradient(bx, by, 0, bx, by, br);
    bg.addColorStop(0, '#fff');
    bg.addColorStop(0.3, b.color || '#ff6b81');
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(bx, by, br * 1.2, 0, Math.PI * 2);
    ctx.fill();
    
    // Solid inner circle
    const si = ctx.createRadialGradient(bx - br*0.2, by - br*0.2, 0, bx, by, br);
    si.addColorStop(0, '#fff');
    si.addColorStop(0.4, b.color || '#e94560');
    si.addColorStop(1, b.color ? adjustColor(b.color, -30) : '#c23152');
    
    ctx.fillStyle = si;
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.fill();
    
    // Score text inside bumper
    if (b.score) {
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${br * 0.5}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.score, bx, by);
    }
    
    // Outer ring
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(bx, by, br + 3, 0, Math.PI * 2);
    ctx.stroke();
    
    ctx.restore();
  });

  // === Draw slingshots (triangular) ===
  slingshots.forEach(s => {
    const sx = s.x / 800 * W;
    const sy = s.y / 1300 * H;
    const sw = s.w / 800 * W;
    const sh = s.h / 1300 * H;
    
    ctx.save();
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#f59e0b';
    ctx.shadowBlur = 12;
    
    if (s.triangular) {
      // Left bumper slingshot: triangle pointing up-left
      const ptsX = sx - sw/2 / 800 * W;
      const topY = sy - sh / 1300 * H;
      
      ctx.beginPath();
      ctx.moveTo(ptsX, topY);
      ctx.lineTo(ptsX + sw, sy + sh/2);
      ctx.lineTo(ptsX, sy + sh);
      ctx.closePath();
      ctx.fillStyle = 'rgba(245,158,11,0.08)';
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  });

  // === Draw flippers ===
  const flipL = cab.flipperLeftPivot;
  const flipR = cab.flipperRightPivot;
  const fLen = cab.flipperLength;
  
  // Left flipper
  ctx.save();
  ctx.lineWidth = Math.max(10, fLen * 0.12);
  ctx.lineCap = 'round';
  if (flippers.left) {
    ctx.strokeStyle = '#00ff88';
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 20;
  } else {
    ctx.strokeStyle = '#0a8f5c';
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
  }
  
  // Normal position: angled down-left
  const leftAngle = flippers.left ? -0.4 : 0.35;
  ctx.beginPath();
  ctx.moveTo(flipL.x, flipL.y);
  ctx.lineTo(flipL.x + Math.cos(leftAngle) * fLen, flipL.y + Math.sin(leftAngle) * fLen);
  ctx.stroke();
  
  // Pivot point
  ctx.fillStyle = '#00ff88';
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = flippers.left ? 15 : 5;
  ctx.beginPath();
  ctx.arc(flipL.x, flipL.y, Math.max(6, fLen * 0.05), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  
  // Right flipper
  ctx.save();
  ctx.lineWidth = Math.max(10, fLen * 0.12);
  ctx.lineCap = 'round';
  if (flippers.right) {
    ctx.strokeStyle = '#00ddff';
    ctx.shadowColor = '#00ddff';
    ctx.shadowBlur = 20;
  } else {
    ctx.strokeStyle = '#0a6f8f';
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
  }
  
  const rightAngle = flippers.right ? Math.PI + 0.4 : Math.PI - 0.35;
  ctx.beginPath();
  ctx.moveTo(flipR.x, flipR.y);
  ctx.lineTo(flipR.x + Math.cos(rightAngle) * fLen, flipR.y + Math.sin(rightAngle) * fLen);
  ctx.stroke();
  
  ctx.fillStyle = '#00ddff';
  ctx.shadowColor = '#00ddff';
  ctx.shadowBlur = flippers.right ? 15 : 5;
  ctx.beginPath();
  ctx.arc(flipR.x, flipR.y, Math.max(6, fLen * 0.05), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // === Draw ball ===
  if (ball.active || ball.y < cab.bottom) {
    const bx = ball.x / 800 * W;
    const by = ball.y / 1300 * H;
    const br = Math.max(4, ball.radius / 800 * W); // ~6px default
    
    ctx.save();
    
    // Glow
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 25;
    
    // Ball gradient
    const bg = ctx.createRadialGradient(bx - br*0.3, by - br*0.3, 0, bx, by, br);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(0.4, '#e8e8ff');
    bg.addColorStop(1, '#8888aa');
    
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.fill();
    
    // Metallic ring
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(bx, by, br + 1, 0, Math.PI * 2);
    ctx.stroke();
    
    ctx.restore();
  }

  // === Draw particles ===
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const px = p.x / 800 * W;
    const py = p.y / 1300 * H;
    const age = p.life / (p.maxLife || 30);
    
    ctx.save();
    ctx.globalAlpha = Math.max(0, age);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(px, py, (p.size || 4) * age, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    
    particles.splice(i, 1);
  }

  // === Plunger lane indicator ===
  ctx.save();
  const pl = cab.plungerLane;
  ctx.strokeStyle = 'rgba(233,69,96,0.2)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(pl.left, cab.top);
  ctx.lineTo(pl.left, cab.bottom);
  ctx.stroke();
  ctx.restore();

  // === Level / info text ===
  ctx.save();
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#f59e0b';
  ctx.shadowColor = '#f59e0b';
  ctx.shadowBlur = 8;
  ctx.textAlign = 'left';
  ctx.fillText(`Nivå ${currentLevel}`, 14, H - 16);
  
  ctx.fillStyle = '#555';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 0;
  ctx.fillText(`${Object.keys(players).length} spillere`, W/2, H - 16);
  
  // Plunger button hint
  if (document.getElementById('ball-launch').style.display === 'block') {
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#e94560';
    ctx.shadowBlur = 8;
    ctx.fillText('Trykk for å skyte!', cab.plungerLane.left + (cab.plungerLane.right - cab.plungerLane.left)/2, cab.bottom + 4);
  }
  
  ctx.restore();

  // === Message overlay ===
  if (messageTimer > 0) {
    messageTimer--;
    const alpha = Math.min(1, messageTimer / 40);
    ctx.save();
    ctx.globalAlpha = alpha;
    drawNeonText(messageText, W/2, H * 0.35, Math.max(28, W * 0.04), '#f59e0b');
    ctx.restore();
    
    if (messageTimer === 0) socket.emit('message-dismissed');
  }

  requestAnimationFrame(drawGame);
}

// --- Color helper ---
function adjustColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + amount));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amount));
  const b = Math.min(255, Math.max(0, (num & 0xff) + amount));
  return `#${(r << 16 | g << 8 | b).toString(16).padStart(6, '0')}`;
}

// --- Name form ---
const nameForm = document.getElementById('name-form');
const joinBtn = document.getElementById('join-btn');
const nameInput = document.getElementById('name-input');

function doJoin() {
  const name = nameInput.value.trim();
  if (!name) return;
  socket.emit('set-name', name);
  nameForm.style.display = 'none';
  initAudio();
}
joinBtn.addEventListener('click', doJoin);
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doJoin(); });

// --- Ball launch button ---
document.getElementById('launch-btn').addEventListener('click', () => {
  socket.emit('ball-launch');
});

// --- Keyboard controls (PC) ---
document.addEventListener('keydown', (e) => {
  if (nameForm.style.display !== 'none') return;
  if (e.key === 'ArrowLeft' || e.key === 'a') {
    socket.emit('flip-left', true);
  }
  if (e.key === 'ArrowRight' || e.key === 'd') {
    socket.emit('flip-right', true);
  }
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') {
    socket.emit('flip-left', false);
  }
  if (e.key === 'ArrowRight' || e.key === 'd') {
    socket.emit('flip-right', false);
  }
});

// --- Start ---
drawGame();
</script>
</body>
</html>
