<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<title>GårdsPengBall 🐓</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0f06; font-family: 'Segoe UI', sans-serif; }
body { display: flex; align-items: center; justify-content: center; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const BOARD_W = 800, BOARD_H = 1300;
let W, H;

/* ── responsive canvas ── */
function resize() {
  const scale = Math.min(window.innerWidth / BOARD_W, window.innerHeight / BOARD_H);
  canvas.width = Math.floor(BOARD_W * scale);
  canvas.height = Math.floor(BOARD_H * scale);
  W = canvas.width;
  H = canvas.height;
}
resize();
window.addEventListener('resize', resize);

const socket = io();

/* ── audio ── */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, dur, type) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

/* ── game state ── */
let layout = null; // brettgeometri fra serveren (vegger, flippere, kanal)
let state = {
  players: [], scores: {}, currentPlayer: null, ballsLeft: 0, ballsPerGame: 3, gameOver: null,
  ball: { x: 670, y: 1180, r: 9, ready: true },
  flippers: { left: { angle: 0.5, pressed: false }, right: { angle: Math.PI - 0.5, pressed: false } },
  bumpers: [],
};
let particles = [];

socket.on('layout', (data) => { layout = data; });

socket.on('state', (data) => {
  // Nytt bumpertreff: lag partikler og lyd her på klienten
  data.bumpers.forEach((b, i) => {
    const prev = state.bumpers[i];
    if (b.hitFlash > 0 && (!prev || b.hitFlash > prev.hitFlash)) {
      addParticles(b.x, b.y, b.color, 12);
      playTone(587, 0.12, 'triangle');
      setTimeout(() => playTone(880, 0.18, 'sine'), 60);
    }
  });
  state = data;
  updateLaunchButton();
});

/* ── helpers ── */
function toX(v) { return v / BOARD_W * W; }
function toY(v) { return v / BOARD_H * H; }
function toR(v) { return v / BOARD_W * W; }

/* ── particles (kun visuelt, lages på klienten) ── */
function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 25, maxLife: 25,
      color: color || '#e94560',
      size: 3 + Math.random() * 3
    });
  }
}

function updateParticles() {
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life--; });
  particles = particles.filter(p => p.life > 0);
}

/* ── draw playfield background ── */
// Gresstrå lages én gang (i brettkoordinater), ellers flimrer de i hvert bilde
const grass = Array.from({ length: 200 }, () => ({
  x: Math.random() * BOARD_W,
  y: 100 + Math.random() * (BOARD_H - 100),
  dx: (Math.random() - 0.5) * 4,
  dy: -6 - Math.random() * 8,
}));

function drawBackground() {
  // Dark green meadow gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a3a20');   // top - darker forest green
  bg.addColorStop(0.4, '#1e4a28'); // mid-meadow
  bg.addColorStop(0.75, '#2d6b38'); // lighter meadow
  bg.addColorStop(1, '#1a3a20');   // bottom drain edge
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle grass texture
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.strokeStyle = '#8fbc6e';
  ctx.lineWidth = 1;
  ctx.beginPath();
  grass.forEach(g => {
    ctx.moveTo(toX(g.x), toY(g.y));
    ctx.lineTo(toX(g.x + g.dx), toY(g.y + g.dy));
  });
  ctx.stroke();
  ctx.restore();

  // Vignette overlay
  const vig = ctx.createRadialGradient(W/2, H*0.45, W*0.2, W/2, H*0.45, W*1.1);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

/* ── draw wooden frame ── */
function drawFrame() {
  const frameW = toR(30); // frame width ~15px scaled
  const insetL = toX(80); // inner edge of left wall (server: 80)
  const insetR = toX(720); // inner edge of right wall (server: 720)

  ctx.save();

  // Outer frame glow (amber LEDs)
  ctx.shadowColor = 'rgba(255,170,30,0.6)';
  ctx.shadowBlur = 18;

  // Left outer edge
  const gradL = ctx.createLinearGradient(insetL - frameW * 1.8, 0, insetL + 4, 0);
  gradL.addColorStop(0, '#5c3a1e');
  gradL.addColorStop(0.3, '#8b5e34');
  gradL.addColorStop(0.7, '#6d4220');
  gradL.addColorStop(1, '#4a2a12');
  ctx.fillStyle = gradL;
  ctx.fillRect(insetL - frameW * 1.8, toY(30), frameW * 1.8, H - toY(60));

  // Right outer edge (outside plunger lane)
  const gradR = ctx.createLinearGradient(insetR, 0, insetR + frameW * 1.8, 0);
  gradR.addColorStop(0, '#4a2a12');
  gradR.addColorStop(0.3, '#6d4220');
  gradR.addColorStop(0.7, '#8b5e34');
  gradR.addColorStop(1, '#5c3a1e');
  ctx.fillStyle = gradR;
  ctx.fillRect(insetR, toY(30), frameW * 1.8, H - toY(60));

  // Nordic carving pattern on frame (decorative zigzag dots)
  ctx.shadowBlur = 0;
  const dotSpacing = toR(18);
  ctx.fillStyle = '#ffb732';
  for (let y = toY(60); y < H - toY(80); y += dotSpacing) {
    // Left frame dots
    drawCarvingDot(insetL - frameW * 0.9, y + (Math.sin(y * 0.02) * 3), toR(2.5));
    // Right frame dots
    drawCarvingDot(insetR + frameW * 0.9, y + (Math.sin(y * 0.02) * 3), toR(2.5));
  }

  ctx.restore();
}

function drawCarvingDot(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

/* ── draw walls (samme linjestykker som serveren bruker i fysikken) ── */
function drawWalls() {
  if (!layout) return;
  ctx.save();
  ctx.strokeStyle = '#a07840';
  ctx.lineWidth = toR(5);
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(160,120,64,0.5)';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  layout.walls.forEach(w => {
    ctx.moveTo(toX(w.x1), toY(w.y1));
    ctx.lineTo(toX(w.x2), toY(w.y2));
  });
  ctx.stroke();
  ctx.restore();
}

/* ── draw plunger lane ── */
function drawPlunger() {
  const lx = toX(620); // left edge of plunger lane
  const rx = toX(720); // right wall
  const pw = rx - lx;

  ctx.save();

  // Plunger lane background
  const laneGrad = ctx.createLinearGradient(lx, 0, rx, 0);
  laneGrad.addColorStop(0, '#2a2015');
  laneGrad.addColorStop(1, '#3a2c1a');
  ctx.fillStyle = laneGrad;
  ctx.fillRect(lx, toY(260), pw, H - toY(260));

  // Spring / plunger mechanism (under ballen som ligger klar)
  const springX = (lx + rx) / 2;
  const springTop = toY(1200);
  const springBot = toY(1290);

  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = toR(3);
  ctx.shadowColor = 'rgba(184,134,11,0.5)';
  ctx.shadowBlur = 8;

  ctx.beginPath();
  ctx.moveTo(springX, springTop);
  for (let y = springTop, i = 0; y < springBot; y += toY(10), i++) {
    ctx.lineTo(springX + (i % 2 ? 1 : -1) * toR(10), y);
  }
  ctx.stroke();

  // Plunger head (wooden peg)
  ctx.shadowBlur = 0;
  const headGrad = ctx.createRadialGradient(springX, springTop, toR(2), springX, springTop, toR(14));
  headGrad.addColorStop(0, '#c9a45e');
  headGrad.addColorStop(1, '#8b6914');
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.ellipse(springX, springTop - toY(2), toR(16), toR(5), 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* ── draw bumpers with animal icons ── */
function drawBumpers() {
  const animals = ['🐓', '🐑', '🐔', '🐴', '🐄'];

  state.bumpers.forEach((b, i) => {
    const bx = toX(b.x);
    const by = toY(b.y);
    const br = toR(b.r);
    const color = b.color || '#ff6b6b';

    ctx.save();

    // Hit flash glow
    if (b.hitFlash > 0) {
      ctx.shadowColor = color;
      ctx.shadowBlur = 35 + b.hitFlash * 3;
      ctx.globalAlpha = 0.4 + (b.hitFlash / 10) * 0.3;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(bx, by, br + toR(5), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    // Bumper body (wooden disc with gradient)
    const bumperGrad = ctx.createRadialGradient(bx - br*0.3, by - br*0.3, br*0.1, bx, by, br);
    if (b.hitFlash > 0) {
      bumperGrad.addColorStop(0, '#ffffff');
      bumperGrad.addColorStop(0.5, color);
      bumperGrad.addColorStop(1, darken(color, 60));
    } else {
      bumperGrad.addColorStop(0, lighten(color, 40));
      bumperGrad.addColorStop(0.7, color);
      bumperGrad.addColorStop(1, darken(color, 30));
    }

    ctx.shadowBlur = 15;
    ctx.shadowColor = color + '80';

    // Outer ring
    ctx.strokeStyle = '#5c3a1e';
    ctx.lineWidth = toR(3);
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.stroke();

    // Fill
    ctx.fillStyle = bumperGrad;
    ctx.beginPath();
    ctx.arc(bx, by, br - toR(2), 0, Math.PI * 2);
    ctx.fill();

    // Animal icon (centered)
    ctx.shadowBlur = 0;
    ctx.font = `${br * 0.95}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(animals[i % animals.length], bx, by + br * 0.05);

    // Score under bumperen
    ctx.fillStyle = 'rgba(255,240,200,0.8)';
    ctx.font = `bold ${toR(14)}px sans-serif`;
    ctx.fillText(b.score, bx, by + br + toR(14));

    ctx.restore();
  });
}

/* ── draw flippers ── */
function drawFlippers() {
  if (!layout) return;
  const fl = layout.flipper;
  drawFlipper(fl.left, fl, state.flippers.left, '#c0c0c0', '#e8e8e8');
  drawFlipper(fl.right, fl, state.flippers.right, '#c0c0c0', '#e8e8e8');
}

function drawFlipper(pivot, fl, flipState, metalColor, highlightColor) {
  ctx.save();

  const px = toX(pivot.px), py = toY(pivot.py);
  const length = toR(fl.len);
  const angle = flipState.angle;
  const endX = px + Math.cos(angle) * length;
  const endY = py + Math.sin(angle) * length;

  // Metallic gradient along flipper
  const fGrad = ctx.createLinearGradient(px, py - toR(8), px, py + toR(8));
  fGrad.addColorStop(0, highlightColor);
  fGrad.addColorStop(0.3, metalColor);
  fGrad.addColorStop(0.7, darken(metalColor, 20));
  fGrad.addColorStop(1, '#888');

  ctx.strokeStyle = fGrad;
  ctx.lineWidth = toR(fl.r * 2);
  ctx.lineCap = 'round';

  if (flipState.pressed) {
    ctx.shadowColor = '#00ffaa';
    ctx.shadowBlur = 20;
  } else {
    ctx.shadowColor = metalColor + '40';
    ctx.shadowBlur = 8;
  }

  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(endX, endY);
  ctx.stroke();

  // Pivot circle
  ctx.shadowBlur = 0;
  const pivotGrad = ctx.createRadialGradient(px - toR(2), py - toR(2), toR(1), px, py, toR(6));
  pivotGrad.addColorStop(0, '#e0e0e0');
  pivotGrad.addColorStop(1, '#666');
  ctx.fillStyle = pivotGrad;
  ctx.beginPath();
  ctx.arc(px, py, toR(6), 0, Math.PI * 2);
  ctx.fill();

  // Rivets on flipper
  ctx.fillStyle = '#999';
  const rivetDist = length * 0.6;
  ctx.beginPath();
  ctx.arc(px + Math.cos(angle) * rivetDist, py + Math.sin(angle) * rivetDist, toR(2.5), 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* ── drain zone (mellom flipperne) ── */
function drawDrain() {
  const left = toX(250), right = toX(450), top = toY(1175);

  ctx.save();
  const grad = ctx.createLinearGradient(0, top, 0, H);
  grad.addColorStop(0, 'rgba(26,18,8,0)');
  grad.addColorStop(1, 'rgba(26,18,8,0.9)');
  ctx.fillStyle = grad;
  ctx.fillRect(left, top, right - left, H - top);

  ctx.fillStyle = 'rgba(255,200,100,0.25)';
  ctx.font = `${toR(14)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('DRAIN', (left + right) / 2, H - toY(30));
  ctx.restore();
}

/* ── draw ball ── */
function drawBall() {
  const ball = state.ball;
  const bx = toX(ball.x);
  const by = toY(ball.y);
  const br = toR(ball.r || 9);

  ctx.save();

  // Ball glow
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 25;

  // Metallic silver ball
  const ballGrad = ctx.createRadialGradient(bx - br*0.3, by - br*0.3, br*0.05, bx, by, br);
  ballGrad.addColorStop(0, '#ffffff');
  ballGrad.addColorStop(0.4, '#e8e8e8');
  ballGrad.addColorStop(0.8, '#b0b0b0');
  ballGrad.addColorStop(1, '#707070');

  ctx.fillStyle = ballGrad;
  ctx.beginPath();
  ctx.arc(bx, by, br, 0, Math.PI * 2);
  ctx.fill();

  // Highlight
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.arc(bx - br*0.25, by - br*0.25, br*0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* ── draw particles ── */
function drawParticles() {
  ctx.save();
  particles.forEach(p => {
    ctx.globalAlpha = (p.life / p.maxLife) * 0.8;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(toX(p.x), toY(p.y), toR(p.size) * (p.life / p.maxLife), 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

/* ── color helpers ── */
function lighten(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}
function darken(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-amt)},${Math.max(0,g-amt)},${Math.max(0,b-amt)})`;
}

/* ── title area ── */
function drawTitle() {
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#ffcc55';
  ctx.font = `bold ${toR(36)}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.shadowColor = '#ffaa22';
  ctx.shadowBlur = 15;
  ctx.fillText('GÅRDSPENGBALL', toX(350), toY(45));
  ctx.restore();
}

/* ── score display (spiller, poeng og baller igjen) ── */
function drawHud() {
  const cx = toX(350);
  const boxW = toR(340), boxH = toR(64);
  const top = toY(100);

  ctx.save();
  ctx.fillStyle = 'rgba(10,8,4,0.75)';
  ctx.strokeStyle = '#8b5e34';
  ctx.lineWidth = toR(2);
  ctx.beginPath();
  ctx.roundRect(cx - boxW / 2, top, boxW, boxH, toR(10));
  ctx.fill();
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const current = state.players.find(p => p.id === state.currentPlayer);

  if (current) {
    const score = state.scores[current.id] || 0;
    ctx.fillStyle = '#ffb732';
    ctx.font = `bold ${toR(30)}px monospace`;
    ctx.fillText(score.toLocaleString('nb-NO'), cx, top + toR(24));
    ctx.fillStyle = '#ddd8c8';
    ctx.font = `${toR(14)}px sans-serif`;
    const ballNo = state.ballsPerGame - state.ballsLeft + 1;
    ctx.fillText(`${current.name} · Ball ${ballNo}/${state.ballsPerGame}`, cx, top + toR(50));
  } else {
    ctx.fillStyle = '#ddd8c8';
    ctx.font = `${toR(15)}px sans-serif`;
    ctx.fillText('Ingen spillere – åpne /score.html', cx, top + toR(22));
    ctx.fillText('og skann QR-koden for å bli med', cx, top + toR(44));
  }
  ctx.restore();
}

function drawGameOver() {
  if (!state.gameOver) return;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, toY(520), W, toR(170));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffcc55';
  ctx.shadowColor = '#ffaa22';
  ctx.shadowBlur = 20;
  ctx.font = `bold ${toR(48)}px serif`;
  ctx.fillText('GAME OVER', W / 2, toY(570));
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = `${toR(22)}px sans-serif`;
  ctx.fillText(`${state.gameOver.name}: ${state.gameOver.score.toLocaleString('nb-NO')} poeng`, W / 2, toY(630));
  ctx.restore();
}

/* ── plunger zone label ── */
function drawPlungerLabel() {
  if (!state.ball.ready) return;
  const cx = (toX(620) + toX(720)) / 2;
  const cy = toY(1050);

  ctx.save();
  ctx.globalAlpha = 0.4 + 0.3 * Math.sin(Date.now() / 200);
  ctx.fillStyle = '#ffcc55';
  ctx.font = `bold ${toR(18)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('SKYV! ▶', 0, 0);
  ctx.restore();
}

/* ── main render loop ── */
function drawGame() {
  updateParticles();

  drawBackground();
  drawFrame();
  drawPlunger();
  drawWalls();
  drawTitle();
  drawHud();
  drawPlungerLabel();
  drawBumpers();
  drawDrain();
  drawFlippers();
  drawBall();
  drawParticles();
  drawGameOver();

  requestAnimationFrame(drawGame);
}

/* ── ball launch button (vises bare når ballen ligger klar) ── */
const launchBtn = document.createElement('button');
launchBtn.textContent = '🚀 Skyv!';
launchBtn.style.cssText = `
  position: absolute; bottom: 20px; right: 15px; z-index: 20;
  width: 80px; height: 80px; border-radius: 50%; font-size: 16px;
  background: radial-gradient(circle, #e94560, #c23152);
  color: #fff; border: 3px solid #ff6b81; cursor: pointer;
  box-shadow: 0 0 20px rgba(233,69,96,0.6); font-weight: bold;
`;
launchBtn.addEventListener('click', () => { initAudio(); socket.emit('ball-launch'); });
document.body.appendChild(launchBtn);

function updateLaunchButton() {
  launchBtn.style.display = state.ball.ready ? 'block' : 'none';
}

/* ── tastatur: piltaster/Z/M for flipperne, mellomrom for å skyte ut ballen ── */
const keyMap = { ArrowLeft: 'flip-left', z: 'flip-left', a: 'flip-left', ArrowRight: 'flip-right', m: 'flip-right', d: 'flip-right' };
document.addEventListener('keydown', (e) => {
  initAudio();
  if (e.repeat) return;
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (keyMap[key]) socket.emit(keyMap[key], true);
  if (key === ' ' || key === 'Enter') { e.preventDefault(); socket.emit('ball-launch'); }
});
document.addEventListener('keyup', (e) => {
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (keyMap[key]) socket.emit(keyMap[key], false);
});
window.addEventListener('click', () => { initAudio(); }, { once: true });

drawGame();
</script>
</body>
</html>
