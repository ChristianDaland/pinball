<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<title>⚡ Pinball Arena</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; font-family: 'Segoe UI', sans-serif; }
#ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10; }
#scorebar { display: flex; justify-content: center; gap: 40px; padding: 12px; }
.player-score { background: rgba(0,0,0,0.6); border: 1px solid rgba(233,69,96,0.4); border-radius: 8px; padding: 8px 20px; color: #fff; text-align: center; }
.player-score .name { font-size: 13px; color: #888; }
.player-score .pts { font-size: 28px; font-weight: bold; color: #4ade80; text-shadow: 0 0 10px rgba(74,222,128,0.5); }
#ball-launch { position: absolute; bottom: 20px; right: 15px; z-index: 20; }
#ball-launch button { width: 80px; height: 80px; border-radius: 50%; font-size: 24px; background: radial-gradient(circle, #e94560, #c23152); color: #fff; border: 3px solid #ff6b81; cursor: pointer; box-shadow: 0 0 20px rgba(233,69,96,0.6); }
#ball-launch button:active { transform: scale(0.9); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="scorebar"></div>
</div>

<div id="ball-launch"><button id="launch-btn">🎱</button></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const ratio = 800 / 1300;
  const winRatio = window.innerWidth / window.innerHeight;
  
  if (winRatio > ratio) {
    canvas.height = Math.min(window.innerHeight, 900);
    canvas.width = canvas.height * ratio;
  } else {
    canvas.width = window.innerWidth;
    canvas.height = canvas.width / ratio;
  }
  W = canvas.width;
  H = canvas.height;
}
resize();
window.addEventListener('resize', resize);

const socket = io();

let players = {};
let scores = {};
let ball = { x: 50, y: 40, r: 7, active: false };
let bumpers = [];
let flippers = { left: false, right: false };

socket.on('state', (data) => {
  if (data.players && Array.isArray(data.players)) {
    players = {};
    data.players.forEach(p => { players[p.id] = { name: p.name }; });
  }
  if (data.scores) scores = data.scores;
  if (data.ball) ball = data.ball;
  bumpers = data.bumpers || [];
  flippers = data.flippers || { left: false, right: false };
  updateUI();
});

function updateUI() {
  const bar = document.getElementById('scorebar');
  const keys = Object.keys(scores);
  if (keys.length === 0) {
    bar.innerHTML = '<div class="player-score"><div class="name">Venter på spiller via QR...</div><div class="pts">0</div></div>';
    return;
  }
  
  let html = '';
  keys.forEach(id => {
    const name = players[id]?.name || 'Spiller';
    html += `<div class="player-score"><div class="name">${name}</div><div class="pts">${scores[id]}</div></div>`;
  });
  bar.innerHTML = html;
}

function drawGame() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0e0e24');
  grad.addColorStop(0.5, '#141438');
  grad.addColorStop(1, '#0a0a1c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Tegn bumpers
  bumpers.forEach(b => {
    const bx = b.x / 800 * W;
    const by = b.y / 1300 * H;
    const br = b.r / 800 * W;
    
    ctx.save();
    ctx.shadowColor = b.color || '#e94560';
    ctx.shadowBlur = 20;
    
    ctx.fillStyle = b.color || '#e94560';
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.fill();
    
    if (b.score) {
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${br * 0.5}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.score, bx, by);
    }
    ctx.restore();
  });

  // Tegn venstre flipper
  const pivotL = { x: 230 / 800 * W, y: 1100 / 1300 * H };
  const fLen = 110 / 800 * W;
  const leftAngle = flippers.left ? -0.4 : 0.35;
  
  ctx.save();
  ctx.lineWidth = Math.max(8, fLen * 0.15);
  ctx.lineCap = 'round';
  ctx.strokeStyle = flippers.left ? '#00ff88' : '#0a8f5c';
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = flippers.left ? 20 : 5;
  
  ctx.beginPath();
  ctx.moveTo(pivotL.x, pivotL.y);
  ctx.lineTo(pivotL.x + Math.cos(leftAngle) * fLen, pivotL.y + Math.sin(leftAngle) * fLen);
  ctx.stroke();
  ctx.restore();

  // Tegn høyre flipper
  const pivotR = { x: 570 / 800 * W, y: 1100 / 1300 * H };
  const rightAngle = flippers.right ? (Math.PI + 0.4) : (Math.PI - 0.35);
  
  ctx.save();
  ctx.lineWidth = Math.max(8, fLen * 0.15);
  ctx.lineCap = 'round';
  ctx.strokeStyle = flippers.right ? '#00ddff' : '#0a6f8f';
  ctx.shadowColor = '#00ddff';
  ctx.shadowBlur = flippers.right ? 20 : 5;
  
  ctx.beginPath();
  ctx.moveTo(pivotR.x, pivotR.y);
  ctx.lineTo(pivotR.x + Math.cos(rightAngle) * fLen, pivotR.y + Math.sin(rightAngle) * fLen);
  ctx.stroke();
  ctx.restore();

  // Tegn ball
  if (ball.active) {
    const bx = ball.x / 800 * W;
    const by = ball.y / 1300 * H;
    const br = Math.max(5, (ball.r || 7) / 800 * W);
    
    ctx.save();
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 25;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(drawGame);
}

document.getElementById('launch-btn').addEventListener('click', () => {
  socket.emit('ball-launch');
});

drawGame();
</script>
</body>
</html>
