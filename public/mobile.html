<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ Pinball Mobil</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0a12;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

.player-bar {
  width: 100%;
  padding: 8px 16px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border-bottom: 2px solid #e94560;
  text-align: center;
  font-size: 18px;
  color: #e94560;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
  flex-shrink: 0;
}

.player-bar span { color: #fff; }

/* Valgt maskin, med lenke tilbake til hovedsiden for å bytte */
.machine-bar {
  width: 100%;
  padding: 8px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.04);
  color: var(--accent, #ffe66d);
  font-weight: bold;
  flex-shrink: 0;
}
.machine-bar a { color: #aaa; font-weight: normal; font-size: 14px; }
.my-turn .machine-bar a { visibility: hidden; }

.buttons-container {
  width: 100%;
  flex: 1;
  display: flex;
  justify-content: space-evenly;
  align-items: center;
  padding: 16px;
  gap: 24px;
}

.flipper-btn {
  width: 48%;
  height: 75%;
  border: none;
  border-radius: 24px;
  font-size: 32px;
  font-weight: bold;
  color: #fff;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.1s, box-shadow 0.15s;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.flipper-btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.4s, height 0.4s;
}

.flipper-btn:active::before {
  width: 300px;
  height: 300px;
}

#flip-left {
  background: linear-gradient(135deg, #e94560, #c23152);
  box-shadow: 0 8px 32px rgba(233, 69, 96, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
}

#flip-left:active {
  background: linear-gradient(135deg, #ff6b81, #e94560);
  box-shadow: 0 4px 16px rgba(233, 69, 96, 0.6), inset 0 1px 0 rgba(255,255,255,0.3);
  transform: scale(0.97);
}

#flip-right {
  background: linear-gradient(135deg, #0f3460, #1a5276);
  box-shadow: 0 8px 32px rgba(15, 52, 96, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
}

#flip-right:active {
  background: linear-gradient(135deg, #1a7a9c, #0f3460);
  box-shadow: 0 4px 16px rgba(15, 52, 96, 0.6), inset 0 1px 0 rgba(255,255,255,0.3);
  transform: scale(0.97);
}

.flipper-icon {
  font-size: 48px;
  display: block;
  margin-bottom: 8px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.launch-btn {
  width: calc(100% - 32px);
  margin: 0 16px 12px;
  padding: 18px;
  border: 3px solid #ffcc55;
  border-radius: 20px;
  background: linear-gradient(135deg, #b8860b, #8b5e34);
  color: #fff;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 2px;
  flex-shrink: 0;
  box-shadow: 0 0 24px rgba(255, 204, 85, 0.4);
}

.launch-btn.charging {
  /* --charge (0–1) settes fra skriptet mens fjæra trekkes */
  background: linear-gradient(90deg, #ff6b1f calc(var(--charge, 0) * 100%), #8b5e34 calc(var(--charge, 0) * 100%));
}

.launch-btn:disabled {
  opacity: 0.25;
  box-shadow: none;
}

.not-my-turn .flipper-btn {
  opacity: 0.35;
}

.status-msg {
  text-align: center;
  padding: 12px;
  font-size: 16px;
  color: #aaa;
  background: #0a0a12;
}

/* Påmelding: vises i stedet for knappene når spilleren ikke står i køen */
.join-panel {
  display: none;
  flex: 1;
  width: 100%;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 24px;
  color: #ccc;
  text-align: center;
  font-size: 18px;
}

.join-btn {
  width: 85%;
  max-width: 420px;
  padding: 28px 16px;
  border: 3px solid #4ade80;
  border-radius: 24px;
  background: linear-gradient(135deg, #15803d, #166534);
  color: #fff;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 1px;
  box-shadow: 0 0 28px rgba(74, 222, 128, 0.35);
}

/* Navnet som vises på brettet og topplista */
.name-field {
  width: 85%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  font-size: 15px;
  color: #aaa;
}
.name-field input {
  width: 100%;
  padding: 16px;
  border: 2px solid #444;
  border-radius: 16px;
  background: #151522;
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  text-align: center;
  user-select: text;
  -webkit-user-select: text;
}
.name-field input:focus { outline: none; border-color: var(--accent, #4ade80); }
.name-field.invalid input { border-color: #e94560; }
.name-hint { min-height: 18px; color: #e94560; font-size: 14px; text-align: center; }

.leave-btn {
  display: none;
  margin: 0 auto 12px;
  padding: 8px 18px;
  border: 1px solid #555;
  border-radius: 999px;
  background: transparent;
  color: #aaa;
  font-size: 14px;
}

.not-in-queue .join-panel { display: flex; }
.not-in-queue .buttons-container,
.not-in-queue .launch-btn { display: none; }
.waiting .leave-btn { display: block; }

.my-turn .status-msg {
  font-size: 18px;
  font-weight: bold;
}

@media (orientation: portrait) {
  .buttons-container {
    flex-direction: column;
    justify-content: center;
  }
  .flipper-btn {
    width: 80%;
    height: 35%;
  }
}
</style>
</head>
<body class="not-in-queue">

<div class="player-bar">Spiller: <span id="player-name">–</span></div>
<div class="machine-bar"><span id="machine-name">…</span><a href="/">Bytt maskin</a></div>

<div class="join-panel" id="join-panel">
  <div id="join-text">Én spiller om gangen – still deg i kø, så får du beskjed når det er din tur.</div>
  <label class="name-field" id="name-field">
    Ditt navn (vises på topplista)
    <input id="name-input" type="text" maxlength="20" autocomplete="nickname" autocapitalize="words"
           enterkeyhint="go" placeholder="Skriv navnet ditt">
    <span class="name-hint" id="name-hint"></span>
  </label>
  <button class="join-btn" id="join-btn">🎮 STILL MEG I KØ</button>
</div>

<div class="buttons-container">
  <button class="flipper-btn" id="flip-left">
    <span class="flipper-icon">◄</span>
    Venstre
  </button>
  <button class="flipper-btn" id="flip-right">
    <span class="flipper-icon">►</span>
    Høyre
  </button>
</div>

<button class="launch-btn" id="launch" disabled>🚀 HOLD OG SLIPP</button>

<div class="status-msg" id="status">Kobler til...</div>
<button class="leave-btn" id="leave-btn">Forlat køen</button>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

// Maskinen spilleren vil spille (fra QR-koden / hovedsiden). Uten maskin: tilbake til hovedsiden.
const machineId = new URLSearchParams(location.search).get('maskin');
if (!machineId) location.replace('/');

// Fast klient-id, så serveren kjenner oss igjen hvis tilkoblingen faller ut.
// crypto.randomUUID finnes bare på https/localhost, derfor reserveløsning.
function makeId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
}
let clientId = localStorage.getItem('pinball-client-id');
if (!clientId) {
  clientId = makeId();
  localStorage.setItem('pinball-client-id', clientId);
}

// Navnet skrives inn før man stiller seg i kø, og huskes til neste gang.
// Gamle automatiske navn ("Spiller_1234") regnes som tomme, så spilleren må velge selv.
const nameInput = document.getElementById('name-input');
const nameField = document.getElementById('name-field');
const nameHint = document.getElementById('name-hint');
let playerName = localStorage.getItem('pinball-player') || '';
if (/^Spiller_\d{4}$/.test(playerName)) playerName = '';
nameInput.value = playerName;
document.getElementById('player-name').textContent = playerName || '–';

function readName() {
  return nameInput.value.trim().replace(/\s+/g, ' ').slice(0, 20);
}
nameInput.addEventListener('input', () => {
  nameField.classList.remove('invalid');
  nameHint.textContent = '';
});
nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); joinQueue(); }
});

// Håndter tilkobling skikkelig
const statusEl = document.getElementById('status');
const launchBtn = document.getElementById('launch');
const joinBtn = document.getElementById('join-btn');
const joinText = document.getElementById('join-text');
const leaveBtn = document.getElementById('leave-btn');
let myId = null;       // offentlig id fra serveren
let wasMyTurn = false;
let wasInQueue = false;
let machineSwitchSent = false;

function setStatus(text, color) {
  if (statusEl.textContent !== text) statusEl.textContent = text;
  statusEl.style.color = color;
}

socket.on('connect', () => {
  setStatus('✓ Tilkoblet!', '#4ade80');
  socket.emit('hello', { clientId, name: playerName });
});

socket.on('you', (data) => { myId = data.id; });

socket.on('machines', (list) => {
  const m = list.find(x => x.id === machineId);
  if (!m) { location.replace('/'); return; }
  document.getElementById('machine-name').textContent = `${m.icon} ${m.name}`;
  document.documentElement.style.setProperty('--accent', (m.colors && m.colors.accent) || '#ffe66d');
  document.title = `${m.name} – kontroller`;
});

function joinQueue() {
  const name = readName();
  if (!name) {
    nameField.classList.add('invalid');
    nameHint.textContent = 'Skriv inn navnet ditt først';
    nameInput.focus();
    return;
  }
  playerName = name;
  nameInput.value = name;
  localStorage.setItem('pinball-player', name);
  document.getElementById('player-name').textContent = name;
  nameInput.blur();
  socket.emit('join-queue', { machine: machineId, name });
  if (navigator.vibrate) navigator.vibrate(20);
}
joinBtn.addEventListener('click', joinQueue);
leaveBtn.addEventListener('click', () => socket.emit('leave-queue'));

socket.on('connect_error', () => {
  setStatus('⚠ Kunne ikke koble til serveren', '#e94560');
});

// Vis om det er min tur, hvor mange baller som er igjen, og om ballen kan skytes ut
socket.on('state', (state) => {
  if (!myId) return;
  const pos = state.players.findIndex(p => p.id === myId);
  const inQueue = pos !== -1;
  const myTurn = state.currentPlayer === myId;

  // Står i kø for en annen maskin (valgt på nytt fra hovedsiden): bytt til denne
  if (inQueue && !myTurn && state.players[pos].machine !== machineId && !machineSwitchSent) {
    machineSwitchSent = true;
    socket.emit('join-queue', { machine: machineId, name: playerName });
  }
  document.body.classList.toggle('not-in-queue', !inQueue);
  document.body.classList.toggle('waiting', inQueue && !myTurn);
  document.body.classList.toggle('my-turn', myTurn);
  document.body.classList.toggle('not-my-turn', !myTurn);
  launchBtn.disabled = !(myTurn && state.ball.ready);
  launchBtn.classList.toggle('charging', state.plunger > 0);
  launchBtn.style.setProperty('--charge', state.plunger || 0);

  // Ferdig med et spill (eller tiden gikk ut): tilby å spille igjen
  if (wasInQueue && !inQueue) {
    joinBtn.textContent = '🔁 SPILL IGJEN';
    const go = state.gameOver && state.gameOver.name === playerName ? state.gameOver : null;
    joinText.textContent = go ? `Game over! Du fikk ${go.score.toLocaleString('nb-NO')} poeng.` : 'Du er ute av køen.';
  }
  wasInQueue = inQueue;

  if (myTurn && !wasMyTurn && navigator.vibrate) navigator.vibrate([200, 100, 200]);
  // Kjenn de store øyeblikkene i hånda
  if (myTurn && navigator.vibrate) {
    for (const e of state.events || []) {
      if (e.type === 'kickback' || e.type === 'ballSaved') navigator.vibrate([60, 40, 60]);
      if (e.type === 'multiplier' || e.type === 'dropsComplete') navigator.vibrate([40, 30, 40, 30, 120]);
      if (e.type === 'drain') navigator.vibrate(300);
    }
  }
  wasMyTurn = myTurn;

  if (!inQueue) {
    const current = state.players.find(p => p.id === state.currentPlayer);
    setStatus(current ? `🎮 ${current.name} spiller nå · ${state.players.length - 1} venter` : '✓ Ledig – ingen spiller nå', '#aaa');
  } else if (myTurn) {
    const score = (state.scores[myId] || 0).toLocaleString('nb-NO');
    const ballNo = state.ballsPerGame - state.ballsLeft + 1;
    if (state.launchCountdown !== null && state.launchCountdown <= 20) {
      setStatus(`🚀 Skyt ut ballen! ${state.launchCountdown} s igjen før turen går videre`, '#ffcc55');
    } else {
      setStatus(`🎮 Din tur! Ball ${ballNo}/${state.ballsPerGame} · ${score} poeng`, '#4ade80');
    }
  } else {
    const current = state.players.find(p => p.id === state.currentPlayer);
    setStatus(`⏳ ${current ? current.name : 'Noen'} spiller nå – du er nr. ${pos} i køen`, '#aaa');
  }
});

// Sender bare når en knapp trykkes eller slippes; serveren husker tilstanden
function sendFlip(side, active) {
  socket.emit(side === 'left' ? 'flip-left' : 'flip-right', active);
  if (active && navigator.vibrate) navigator.vibrate(20);
}

// Oppskyting: hold inne for å trekke fjæra (lengre = hardere), slipp for å skyte
let pulling = false;
function startPull() {
  if (pulling || launchBtn.disabled) return;
  pulling = true;
  socket.emit('plunger-pull');
  if (navigator.vibrate) navigator.vibrate(15);
}
function release() {
  if (!pulling) return;
  pulling = false;
  socket.emit('ball-launch');
  if (navigator.vibrate) navigator.vibrate(40);
}
launchBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startPull(); });
launchBtn.addEventListener('touchend', (e) => { e.preventDefault(); release(); });
launchBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); release(); });
launchBtn.addEventListener('mousedown', startPull);
launchBtn.addEventListener('mouseup', release);
launchBtn.addEventListener('mouseleave', release);

const leftBtn = document.getElementById('flip-left');
const rightBtn = document.getElementById('flip-right');

leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); sendFlip('left', true); });
leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); sendFlip('left', false); });
leftBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); sendFlip('left', false); });

rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); sendFlip('right', true); });
rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); sendFlip('right', false); });
rightBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); sendFlip('right', false); });

leftBtn.addEventListener('mousedown', () => sendFlip('left', true));
leftBtn.addEventListener('mouseup', () => sendFlip('left', false));
leftBtn.addEventListener('mouseleave', () => sendFlip('left', false));

rightBtn.addEventListener('mousedown', () => sendFlip('right', true));
rightBtn.addEventListener('mouseup', () => sendFlip('right', false));
rightBtn.addEventListener('mouseleave', () => sendFlip('right', false));

document.addEventListener('keydown', (e) => {
  if (e.target === nameInput) return;
  if (e.repeat) return;
  if (e.key === 'ArrowLeft' || e.key === 'a') sendFlip('left', true);
  if (e.key === 'ArrowRight' || e.key === 'd') sendFlip('right', true);
  if (e.key === ' ') { e.preventDefault(); startPull(); }
});

document.addEventListener('keyup', (e) => {
  if (e.target === nameInput) return;
  if (e.key === 'ArrowLeft' || e.key === 'a') sendFlip('left', false);
  if (e.key === 'ArrowRight' || e.key === 'd') sendFlip('right', false);
  if (e.key === ' ') release();
});
</script>
</body>
</html>
