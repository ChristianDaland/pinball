<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinball - Poengtavle</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0a0a2e 0%, #1a0a3e 50%, #0a0a2e 100%);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 3em;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ff6b6b, #ffe66d, #4ecdc4, #ff6b6b);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            color: #888;
            font-size: 1em;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        #qrcode {
            background: white;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.3);
        }

        .scan-hint {
            color: #4ecdc4;
            font-size: 1.1em;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .scoreboard {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #333;
            border-radius: 20px;
            padding: 25px 40px;
            min-width: 400px;
            margin-bottom: 30px;
        }

        .scoreboard h2 {
            text-align: center;
            color: #ffe66d;
            font-size: 1.2em;
            letter-spacing: 3px;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-name {
            font-size: 1.1em;
        }

        .player-score {
            font-size: 1.4em;
            font-weight: bold;
            font-family: monospace;
            min-width: 80px;
            text-align: right;
        }

        .high-scores {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px 30px;
            min-width: 400px;
        }

        .high-scores h2 {
            text-align: center;
            color: #a8e6cf;
            font-size: 1.1em;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .hs-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            color: #888;
        }

        .hs-row:first-child { color: #ffe66d; font-weight: bold; font-size: 1.1em; }
        .hs-row:nth-child(2) { color: #ff6b6b; }
        .hs-row:nth-child(3) { color: #4ecdc4; }

        .empty-state {
            text-align: center;
            color: #555;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>⚡ Pinball ⚡</h1>
    <div class="subtitle">Poengtavle</div>

    <div id="qrcode"></div>
    <div class="scan-hint">📱 Skann QR-koden for å spille!</div>

    <div class="scoreboard" id="scoreboard">
        <h2>🎮 AKTIVE SPILLERE</h2>
        <div id="player-list"><div class="empty-state">Venter på spillere...</div></div>
    </div>

    <div class="high-scores" id="hs-board">
        <h2>🏆 TOPPLISTE</h2>
        <div id="hs-list"><div class="empty-state">Ingen resultater ennå</div></div>
    </div>

    <script>
        const socket = io();
        const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a8e6cf', '#ff8b94', '#dda0dd', '#f39c12', '#5dade2'];

        new QRCode(document.getElementById('qrcode'), {
            text: window.location.origin + '/mobile.html',
            width: 140,
            height: 140,
        });

        let lastState = null;

        // Spillernavn kommer fra brukerne og må aldri settes rett inn som HTML
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        socket.on('state', (state) => {
            // Staten kommer 60 ganger i sekundet; tegn bare på nytt når noe på tavla har endret seg
            const relevant = JSON.stringify([state.players, state.scores, state.currentPlayer, state.highScores]);
            if (lastState === relevant) return;
            lastState = relevant;

            // Aktive spillere, i turrekkefølge
            const playerList = document.getElementById('player-list');

            if (state.players.length === 0) {
                playerList.innerHTML = '<div class="empty-state">Ingen spillere tilkoblet</div>';
            } else {
                let html = '';
                state.players.forEach((p, i) => {
                    const name = escapeHtml(p.name);
                    const score = state.scores[p.id] || 0;
                    const color = colors[i % colors.length];
                    const icon = p.id === state.currentPlayer ? '▶️' : '🪙';
                    html += `
                        <div class="player-row">
                            <span class="player-name" style="color:${color}">${icon} ${name}</span>
                            <span class="player-score" style="color:${color}">${score.toLocaleString()}p</span>
                        </div>
                    `;
                });
                playerList.innerHTML = html;
            }

            // Toppliste
            const hsList = document.getElementById('hs-list');
            if (state.highScores && state.highScores.length > 0) {
                let html = '';
                state.highScores.slice(0, 5).forEach((hs, i) => {
                    html += `
                        <div class="hs-row">
                            <span>${i + 1}. ${escapeHtml(hs.name)}</span>
                            <span>${hs.score.toLocaleString()}p</span>
                        </div>
                    `;
                });
                hsList.innerHTML = html;
            } else {
                hsList.innerHTML = '<div class="empty-state">Ingen resultater ennå</div>';
            }
        });
    </script>
</body>
</html>
